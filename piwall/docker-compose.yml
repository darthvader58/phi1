services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DB}?authSource=admin
      MONGODB_DB: ${MONGODB_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./fastf1_cache:/app/fastf1_cache
      - ./processed_cache:/app/processed_cache

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Client-side, so it must be baked in at build time.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "3000:3000"
    environment:
      # Read server-side, inside this container: the proxy routes and NextAuth
      # both run in the Next.js process. "localhost" here is the frontend
      # container itself, so the backend is addressed by its service name.
      BACKEND_API_URL: http://backend:8000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DB}?authSource=admin
      MONGODB_DB: ${MONGODB_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Dialled by the visitor's browser, so it stays a host address.
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mongodata:
